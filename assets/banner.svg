<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Avemeo API &amp; AI Connector – digital signage, hotel TV and in-store audio, managed from your AI assistant</title>
  <desc id="d">Banner: a chat prompt flows through the Avemeo MCP connector and REST API to the Avemeo cloud and to screens, hotel TVs and audio players.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <!-- Title block -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="112" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Avemeo API &amp; AI Connector</text>
    <rect x="64" y="128" width="200" height="6" rx="3" fill="url(#accent)"/>
    <text x="64" y="176" font-size="23" font-weight="500" fill="#cbd5e1">Digital signage · Hotel TV · In-store audio</text>
    <text x="64" y="208" font-size="17" fill="#94a3b8">REST API (OpenAPI 3) and MCP connector</text>
    <text x="64" y="234" font-size="17" fill="#94a3b8">for Claude, ChatGPT, Gemini and other AI assistants</text>

    <!-- Prompt pill -->
    <g transform="translate(64 268)">
      <rect width="520" height="64" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
      <circle cx="32" cy="32" r="14" fill="url(#accent)"/>
      <path d="M26 32l4 4 8-9" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="39" font-size="19" fill="#e2e8f0" font-style="italic">“Reboot all screens in the Košice group.”</text>
    </g>

    <!-- Flow diagram on the right -->
    <g transform="translate(730 78) scale(0.95)">
      <!-- AI assistant -->
      <g>
        <rect width="150" height="78" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="75" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">AI assistant</text>
        <text x="75" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Claude · ChatGPT · Gemini</text>
      </g>
      <path d="M150 39H200" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="175" y="26" text-anchor="middle" font-size="11" fill="#7dd3fc">MCP</text>

      <!-- Connector -->
      <g transform="translate(205 0)" filter="url(#glow)">
        <rect width="150" height="78" rx="14" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8"/>
        <text x="75" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#e0f2fe">Avemeo connector</text>
        <text x="75" y="56" text-anchor="middle" font-size="12" fill="#bae6fd">OAuth · approval · audit</text>
      </g>
      <path d="M355 39H405" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="380" y="26" text-anchor="middle" font-size="11" fill="#7dd3fc">REST</text>

      <!-- Cloud -->
      <g transform="translate(410 0)">
        <rect width="110" height="78" rx="14" fill="#1e293b" stroke="#334155"/>
        <text x="55" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5f9">Avemeo</text>
        <text x="55" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">cloud CMS</text>
      </g>

      <!-- Down arrow to devices -->
      <path d="M465 78V118" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

      <!-- Devices row -->
      <g transform="translate(0 125)">
        <!-- screen -->
        <g>
          <rect x="0" y="0" width="150" height="90" rx="10" fill="#1e293b" stroke="#334155"/>
          <rect x="26" y="16" width="98" height="46" rx="4" fill="#0b1220" stroke="#64748b"/>
          <rect x="34" y="24" width="50" height="8" rx="2" fill="#34d399"/>
          <rect x="34" y="38" width="80" height="6" rx="2" fill="#38bdf8"/>
          <rect x="34" y="50" width="60" height="6" rx="2" fill="#475569"/>
          <text x="75" y="80" text-anchor="middle" font-size="12" fill="#cbd5e1">Signage screens</text>
        </g>
        <!-- hotel TV -->
        <g transform="translate(170 0)">
          <rect x="0" y="0" width="150" height="90" rx="10" fill="#1e293b" stroke="#334155"/>
          <rect x="26" y="16" width="98" height="46" rx="4" fill="#0b1220" stroke="#64748b"/>
          <circle cx="50" cy="39" r="12" fill="none" stroke="#34d399" stroke-width="3"/>
          <rect x="70" y="27" width="44" height="6" rx="2" fill="#e2e8f0"/>
          <rect x="70" y="39" width="36" height="6" rx="2" fill="#475569"/>
          <rect x="70" y="51" width="30" height="6" rx="2" fill="#475569"/>
          <text x="75" y="80" text-anchor="middle" font-size="12" fill="#cbd5e1">Hotel TV &amp; menus</text>
        </g>
        <!-- audio -->
        <g transform="translate(340 0)">
          <rect x="0" y="0" width="180" height="90" rx="10" fill="#1e293b" stroke="#334155"/>
          <g transform="translate(50 14)" fill="#34d399">
            <rect x="0" y="18" width="6" height="20" rx="3"/>
            <rect x="12" y="8" width="6" height="40" rx="3"/>
            <rect x="24" y="0" width="6" height="56" rx="3"/>
            <rect x="36" y="12" width="6" height="32" rx="3"/>
            <rect x="48" y="22" width="6" height="12" rx="3"/>
            <rect x="60" y="6" width="6" height="44" rx="3"/>
            <rect x="72" y="16" width="6" height="24" rx="3"/>
          </g>
          <text x="90" y="80" text-anchor="middle" font-size="12" fill="#cbd5e1">In-store audio &amp; video</text>
        </g>
      </g>
    </g>

    <!-- Footer -->
    <text x="64" y="366" font-size="14" fill="#64748b">github.com/sortec-europe/avemeo-api · maintained by SORTEC EUROPE s.r.o. · Avemeo is a product of Avemeo s.r.o.</text>
  </g>
</svg>
