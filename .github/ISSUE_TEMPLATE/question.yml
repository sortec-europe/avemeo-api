name: Question
description: Ask about the Avemeo REST API, the AI connector (MCP) or an integration.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions that involve your account, customer data or credentials are better sent to [avemeo@sortec.sk](mailto:avemeo@sortec.sk). Never post tokens, passwords or API keys here.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - REST API
        - AI connector (MCP)
        - Avemeo platform / devices
        - Pilot program
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true
  - type: input
    id: cloud
    attributes:
      label: Cloud (optional)
      placeholder: ds.avemeo.com or cloud.tvstream.sk
